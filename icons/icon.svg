<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="100%" stop-color="#12141d"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e2333" stroke-width="8"/>

  <!-- Barbell Plates -->
  <!-- Left Inner Plate -->
  <rect x="74" y="160" width="34" height="192" rx="10" fill="url(#emeraldGrad)"/>
  <!-- Left Outer Plate -->
  <rect x="120" y="128" width="38" height="256" rx="12" fill="url(#emeraldGrad)"/>
  <!-- Left Collar -->
  <rect x="170" y="216" width="16" height="80" rx="4" fill="#94a3b8"/>

  <!-- Barbell Center Bar -->
  <rect x="150" y="240" width="212" height="32" rx="8" fill="#e2e8f0" filter="url(#glow)"/>

  <!-- Right Collar -->
  <rect x="326" y="216" width="16" height="80" rx="4" fill="#94a3b8"/>
  <!-- Right Inner Plate -->
  <rect x="354" y="128" width="38" height="256" rx="12" fill="url(#emeraldGrad)"/>
  <!-- Right Outer Plate -->
  <rect x="404" y="160" width="34" height="192" rx="10" fill="url(#emeraldGrad)"/>

  <!-- Electric Lightning Accent in Center -->
  <polygon points="266,160 230,260 264,260 246,352 292,246 256,246" fill="#f59e0b" filter="url(#glow)"/>
</svg>
